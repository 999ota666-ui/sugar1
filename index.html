<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة متابعة سكر الدم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864; --teal:#2E75B6; --bg:#EEF3F9; --card:#fff; --ink:#1d2433; --muted:#6b7385;
    --ok:#1e8e4e; --okbg:#e3f5ea; --low:#c62828; --lowbg:#fde7e7; --high:#c56a10; --highbg:#fff1df;
    --line:#e3e8ef;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"Tajawal",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 32px}
  .hero{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(31,56,100,.25)}
  .hero:after{content:"";position:absolute;left:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero .school{font-size:14px;opacity:.85;font-weight:500}
  .hero h1{margin:4px 0 14px;font-size:24px;font-weight:800}
  .who{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500}
  .chip b{font-weight:800}
  .period{margin-top:12px;font-size:13px;opacity:.85}
  .status{margin:16px 0 0;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:16px}
  .status .dot{width:14px;height:14px;border-radius:50%;flex:none}
  .s-ok{background:var(--okbg);color:var(--ok)} .s-ok .dot{background:var(--ok)}
  .s-warn{background:var(--highbg);color:var(--high)} .s-warn .dot{background:var(--high)}
  .s-low{background:var(--lowbg);color:var(--low)} .s-low .dot{background:var(--low)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .tile{background:var(--card);border-radius:18px;padding:14px 14px 12px;box-shadow:0 2px 10px rgba(20,40,80,.06)}
  .tile .k{font-size:13px;color:var(--muted);font-weight:500}
  .tile .v{font-size:30px;font-weight:800;margin-top:2px;line-height:1.1}
  .tile .u{font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:4px}
  .v.ok{color:var(--ok)} .v.low{color:var(--low)} .v.high{color:var(--high)} .v.navy{color:var(--navy)}
  .section{background:var(--card);border-radius:20px;margin-top:14px;padding:16px;box-shadow:0 2px 10px rgba(20,40,80,.06)}
  .section h2{margin:0 0 12px;font-size:17px;color:var(--navy);font-weight:800}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .day{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}
  .day:last-child{border-bottom:0}
  .day .d b{display:block;font-size:15px}
  .day .d small{color:var(--muted);font-size:12px}
  .reads{display:flex;gap:8px}
  .pill{min-width:70px;text-align:center;border-radius:12px;padding:6px 8px;font-weight:800;font-size:16px;line-height:1.1}
  .pill small{display:block;font-size:10.5px;font-weight:500;opacity:.85;margin-top:2px}
  .p-ok{background:var(--okbg);color:var(--ok)} .p-low{background:var(--lowbg);color:var(--low)} .p-high{background:var(--highbg);color:var(--high)} .p-na{background:#f1f3f6;color:#a0a7b4}
  .ranges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:13px}
  .ranges div{border-radius:12px;padding:10px 4px;font-weight:700}
  .ranges small{display:block;font-weight:500;margin-top:2px}
  .note{font-size:13.5px;line-height:1.8;color:#46506a;margin-top:12px}
  .foot{margin-top:14px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .foot .r{font-size:12px;opacity:.8}
  .foot b{font-size:16px}
  .demo{margin-top:12px;background:#fff8e1;border:1px dashed #e0b84a;color:#7a5a00;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7}
  .empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .rd{background:var(--card);border-radius:20px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(20,40,80,.06);border-top:6px solid #d9dee6}
  .rd .k{font-size:14px;color:var(--muted);font-weight:500}
  .rd .v{font-size:44px;font-weight:800;line-height:1.15;margin:6px 0 2px}
  .rd .u{font-size:12px;color:var(--muted)}
  .rd .tag{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .rd.ok{border-top-color:var(--ok)} .rd.ok .v{color:var(--ok)} .rd.ok .tag{background:var(--okbg);color:var(--ok)}
  .rd.low{border-top-color:var(--low)} .rd.low .v{color:var(--low)} .rd.low .tag{background:var(--lowbg);color:var(--low)}
  .rd.high{border-top-color:var(--high)} .rd.high .v{color:var(--high)} .rd.high .tag{background:var(--highbg);color:var(--high)}
  .rd.na .v{color:#b4bac6} .rd.na .tag{background:#f1f3f6;color:#8b93a1}
  .tips{list-style:none;margin:0;padding:0}
  .tips li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.7}
  .tips li:last-child{border-bottom:0}
  .tips .n{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;margin-top:2px}
  .disc{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  .act{display:flex;gap:12px;align-items:flex-start;background:#eef4fb;border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.7;font-weight:500;color:#1F3864}
  .act .ic{flex:none;width:30px;height:30px;border-radius:9px;background:#1F3864;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
  .act.none{background:#f4f5f7;color:#8b93a1}
  .act.none .ic{background:#c3c8d0}
  .dayline{margin-top:12px;font-size:14px;font-weight:700;background:rgba(255,255,255,.16);display:inline-block;padding:6px 14px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  var DEMO="2|مدرسة النموذجية|تركي الرحيلي|S001||خامس / أ|70|180|9/11/2026|118|196|شرب ماء وأُعيد القياس لاحقًا";
  var raw="", demo=false;
  try{ raw=decodeURIComponent((location.hash||"").replace(/^#/,"")); }catch(e){ raw=""; }
  if(!/^2\|/.test(raw)){ raw=DEMO; demo=true; }
  var p=raw.split("|");
  function num(v){ return (v===undefined||v===""||isNaN(+v))?null:+v; }
  var d={school:p[1]||"",sup:p[2]||"",id:p[3]||"",name:p[4]||"",cls:p[5]||"",low:+p[6]||70,high:+p[7]||180,date:p[8]||"",r1:num(p[9]),r2:num(p[10]),act:(p[11]||"").trim()};
  var dm=d.date.split("/"), dt=dm.length===3?new Date(+dm[2],(+dm[1])-1,+dm[0]):null;
  function cls(v){ if(v==null) return "na"; return v<d.low?"low":(v>d.high?"high":"ok"); }
  function lab(c){ return c==="low"?"منخفض":c==="high"?"مرتفع":c==="ok"?"طبيعي":"لم يُقَس"; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var c1=cls(d.r1), c2=cls(d.r2);
  var worst = (c1==="low"||c2==="low")?"low":(c1==="high"||c2==="high")?"high":(c1==="ok"||c2==="ok")?"ok":"na";
  var STATUS={low:["s-low","تم تسجيل قراءة منخفضة اليوم"],high:["s-warn","تم تسجيل قراءة مرتفعة اليوم"],ok:["s-ok","قراءات اليوم ضمن المعدل الطبيعي 👍"],na:["s-ok","لم تُسجَّل قراءات لهذا اليوم"]};
  var TIPS={
    low:["عند الانخفاض: أعطِ الطالب 15 غرامًا من السكريات السريعة (نصف كوب عصير أو 3–4 حبات تمر)، ثم أعد القياس بعد 15 دقيقة.",
         "إذا بقيت القراءة أقل من "+d.low+" كرّر الخطوة، وبعد التحسن قدّم وجبة خفيفة.",
         "احرص على إفطار كافٍ قبل المدرسة، ووجود وجبة خفيفة مع الطالب دائمًا.",
         "إذا تكرر الانخفاض، راجع جرعة الدواء ومواعيد الوجبات مع الطبيب المعالج."],
    high:["شجّع الطالب على شرب الماء بكثرة.",
          "قلّل الحلويات والمشروبات السكرية، وأعد القياس لاحقًا.",
          "التزم بجرعات الأنسولين أو الدواء حسب الخطة العلاجية، ولا تعدّلها دون الرجوع للطبيب.",
          "إذا تجاوزت القراءة 250 أو ظهرت أعراض مثل العطش الشديد أو الغثيان أو التعب، تواصل مع الطبيب فورًا."],
    ok:["ممتاز! استمروا على نفس النظام.",
        "إفطار متوازن قبل المدرسة يساعد على استقرار السكر طوال اليوم.",
        "شرب الماء والنشاط البدني المعتدل يوميًا.",
        "ضع وجبة خفيفة صحية في حقيبة الطالب للاحتياط."],
    na:["تابع مع المدرسة لمعرفة سبب عدم تسجيل القياس اليوم."]};
  var COL={low:"#c62828",high:"#c56a10",ok:"#1e8e4e",na:"#8b93a1"};
  var h="";
  h+='<div class="hero"><div class="school">'+esc(d.school)+'</div><h1>قراءات السكر اليومية</h1><div class="who">';
  h+='<span class="chip">رقم الطالب: <b>'+esc(d.id)+'</b></span>';
  if(d.name) h+='<span class="chip"><b>'+esc(d.name)+'</b></span>';
  if(d.cls) h+='<span class="chip">الفصل: <b>'+esc(d.cls)+'</b></span>';
  h+='</div><div class="dayline">'+(dt?DAYS[dt.getDay()]+' — ':'')+esc(d.date)+'</div></div>';
  if(demo) h+='<div class="demo">هذا مثال توضيحي. عند مسح باركود الطالب تظهر هنا قراءاته الفعلية.</div>';
  h+='<div class="status '+STATUS[worst][0]+'"><span class="dot"></span>'+STATUS[worst][1]+'</div>';
  h+='<div class="big">';
  [[d.r1,c1,"القياس الأول"],[d.r2,c2,"القياس الثاني"]].forEach(function(r){
    h+='<div class="rd '+r[1]+'"><div class="k">'+r[2]+'</div><div class="v">'+(r[0]==null?'—':r[0])+'</div><div class="u">mg/dL</div><span class="tag">'+lab(r[1])+'</span></div>';
  });
  h+='</div>';
  var noAct=!d.act;
  h+='<div class="section"><h2>الإجراء المتخذ في المدرسة</h2><div class="act'+(noAct?' none':'')+'"><span class="ic">'+(noAct?'–':'✓')+'</span><span>'+(noAct?'لم يُسجَّل إجراء لهذا اليوم':esc(d.act))+'</span></div></div>';
  h+='<div class="section"><h2>نصائح لكم</h2><ul class="tips">';
  TIPS[worst].forEach(function(t,i){ h+='<li><span class="n" style="background:'+COL[worst]+'">'+(i+1)+'</span><span>'+esc(t)+'</span></li>'; });
  h+='</ul><div class="disc">هذه نصائح عامة ولا تغني عن تعليمات الطبيب المعالج وخطة الرعاية الخاصة بالطالب.</div></div>';
  h+='<div class="section"><h2>دليل القراءات</h2><div class="ranges">';
  h+='<div class="p-low">منخفض<small>أقل من '+d.low+'</small></div><div class="p-ok">طبيعي<small>'+d.low+' – '+d.high+'</small></div><div class="p-high">مرتفع<small>أعلى من '+d.high+'</small></div></div></div>';
  h+='<div class="foot"><div><div class="r">الموجه</div><b>'+esc(d.sup)+'</b></div><div class="r">'+esc(d.school)+'</div></div>';
  document.getElementById("app").innerHTML=h;
})();
</script>
</body>
</html>
